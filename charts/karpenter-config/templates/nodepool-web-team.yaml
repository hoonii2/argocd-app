{{- if .Values.teams.web.enabled }}
---
# ARM64 NodePool (우선순위 높음 - 비용 절감)
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: web-team-{{ .Values.environment }}-arm64-pool
  labels:
    team: web
    environment: {{ .Values.environment }}
    architecture: arm64
    {{- include "karpenter-config.labels" . | nindent 4 }}
spec:
  template:
    metadata:
      labels:
        team: web
        environment: {{ .Values.environment }}
        workload-type: frontend
        architecture: arm64
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: web-team-{{ .Values.environment }}

      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            {{- range .Values.teams.web.capacityTypes }}
            - {{ . | quote }}
            {{- end }}

        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            {{- range .Values.teams.web.arm64.instanceTypes }}
            - {{ . | quote }}
            {{- end }}

        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]

        - key: kubernetes.io/os
          operator: In
          values: ["linux"]

      # Team + Architecture isolation
      taints:
        - key: team
          value: web
          effect: NoSchedule
        - key: architecture
          value: arm64
          effect: NoSchedule

  limits:
    cpu: {{ .Values.teams.web.limits.cpu | quote }}
    memory: {{ .Values.teams.web.limits.memory | quote }}

  weight: 10  # 낮은 우선순위 = 먼저 선택 (ARM이 저렴)

  disruption:
    consolidationPolicy: {{ .Values.teams.web.disruption.consolidationPolicy }}
    consolidateAfter: {{ .Values.teams.web.disruption.consolidateAfter }}
    budgets:
      {{- toYaml .Values.teams.web.disruption.budgets | nindent 6 }}

---
# AMD64 NodePool (폴백용)
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: web-team-{{ .Values.environment }}-amd64-pool
  labels:
    team: web
    environment: {{ .Values.environment }}
    architecture: amd64
    {{- include "karpenter-config.labels" . | nindent 4 }}
spec:
  template:
    metadata:
      labels:
        team: web
        environment: {{ .Values.environment }}
        workload-type: frontend
        architecture: amd64
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: web-team-{{ .Values.environment }}

      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            {{- range .Values.teams.web.capacityTypes }}
            - {{ . | quote }}
            {{- end }}

        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            {{- range .Values.teams.web.amd64.instanceTypes }}
            - {{ . | quote }}
            {{- end }}

        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]

        - key: kubernetes.io/os
          operator: In
          values: ["linux"]

      # Team + Architecture isolation
      taints:
        - key: team
          value: web
          effect: NoSchedule
        - key: architecture
          value: amd64
          effect: NoSchedule

  limits:
    cpu: {{ .Values.teams.web.limits.cpu | quote }}
    memory: {{ .Values.teams.web.limits.memory | quote }}

  weight: 50  # 높은 우선순위 = 나중에 선택 (x86이 비쌈)

  disruption:
    consolidationPolicy: {{ .Values.teams.web.disruption.consolidationPolicy }}
    consolidateAfter: {{ .Values.teams.web.disruption.consolidateAfter }}
    budgets:
      {{- toYaml .Values.teams.web.disruption.budgets | nindent 6 }}
{{- end }}
