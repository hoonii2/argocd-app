apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: promtail
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: promtail
    targetRevision: 6.16.6
    helm:
      values: |
        # Loki endpoint
        config:
          clients:
            - url: http://loki.observability.svc.cluster.local:3100/loki/api/v1/push

          snippets:
            pipelineStages:
              - cri: {}
              - multiline:
                  firstline: '^\d{4}-\d{2}-\d{2}'
                  max_wait_time: 3s
              - labeldrop:
                  - filename
                  - stream

        # DaemonSet resources
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi

        # Tolerations to run on all nodes
        tolerations:
          - operator: Exists

        # Service account
        serviceAccount:
          create: true
          name: promtail

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
