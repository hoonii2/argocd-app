apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://charts.jenkins.io
    chart: jenkins
    targetRevision: 5.8.110
    helm:
      values: |
        controller:
          serviceType: ClusterIP

          # Ingress for ALB (shared with ArgoCD)
          ingress:
            enabled: true
            ingressClassName: alb
            hostName: jenkins.hoonii2.store
            annotations:
              alb.ingress.kubernetes.io/group.name: devops-alb
              alb.ingress.kubernetes.io/scheme: internet-facing
              alb.ingress.kubernetes.io/target-type: ip
              alb.ingress.kubernetes.io/backend-protocol: HTTP
              alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
              alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:476120258327:certificate/921a2829-3004-4c74-8930-7fdb44e1d5c5
              alb.ingress.kubernetes.io/ssl-redirect: "443"
              external-dns.alpha.kubernetes.io/hostname: jenkins.hoonii2.store

          # Use default plugins from chart (recommended by official docs)
          # Note: docker-workflow and amazon-ecr installed via Jenkins UI

          JCasC:
            defaultConfig: true
            configScripts:
              welcome-message: |
                jenkins:
                  systemMessage: "Jenkins for EKS MSA CI/CD"

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

          tolerations:
            - key: "team"
              operator: "Equal"
              value: "devops"
              effect: "NoSchedule"
            - key: "architecture"
              operator: "Equal"
              value: "arm64"
              effect: "NoSchedule"

          nodeSelector:
            kubernetes.io/arch: arm64
            team: devops

        agent:
          enabled: true
          tolerations:
            - key: "team"
              operator: "Equal"
              value: "devops"
              effect: "NoSchedule"
            - key: "architecture"
              operator: "Equal"
              value: "arm64"
              effect: "NoSchedule"
          nodeSelector:
            kubernetes.io/arch: arm64
            team: devops

        persistence:
          enabled: true
          size: 10Gi
          storageClass: gp2

  destination:
    server: https://kubernetes.default.svc
    namespace: devops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
