# my-cluster 설정
clusterName: my-cluster

# Instance Profile (Terraform output)
instanceProfileName: "eks_nodes-node-group-20251017051314602800000007-20251018151915235400000002"

nodePool:
  # On-Demand: 활성화
  ondemand:
    enabled: true
    
    instanceTypes:
      - t3.micro
      - t3.small
    
    limits:
      cpu: "10"       # Dev는 적게
      memory: "20Gi"
    
    weight: 50
    
    disruption:
      policy: WhenEmptyOrUnderutilized
      after: 30s      # Dev는 빠르게
      budgets:
        nodes: "100%" # Dev는 제한 없음
  
  # Spot: 활성화 (Dev에서 테스트)
  spot:
    enabled: true
    
    instanceTypes:
      - t3.micro
      - t3.small
      - c7i-flex.large
    
    limits:
      cpu: "10"       # Dev는 On-Demand와 동일
      memory: "20Gi"
    
    weight: 10  # Spot 우선 선택
    
    disruption:
      policy: WhenEmptyOrUnderutilized
      after: 30s
      budgets:
        nodes: "100%"

ec2NodeClass:
  name: default
  amiFamily: al2023
  
  blockDevice:
    volumeSize: 20Gi
    volumeType: gp3
    encrypted: true
  
  metadata:
    httpTokens: required
    httpPutResponseHopLimit: 2

tags:
  managed-by: argocd
  team: devops
  environment: dev

# ========================================
# Team NodePools (Dev 환경에서 활성화)
# ========================================
teams:
  web:
    enabled: true  # Web 팀 NodePool 활성화

    capacityTypes:
      - on-demand

    instanceTypes:
      - t3.micro
      - t3.small

    limits:
      cpu: "4"
      memory: "8Gi"

    weight: 30

    disruption:
      policy: WhenEmptyOrUnderutilized
      after: 1m
      budgets:
        nodes: "50%"

  android:
    enabled: true  # Android 팀 NodePool 활성화

    capacityTypes:
      - on-demand

    instanceTypes:
      - t3.small
      - t4g.small
      - t4g.micro

    arch:
      - amd64
      - arm64

    limits:
      cpu: "4"
      memory: "8Gi"

    weight: 30

    disruption:
      policy: WhenEmptyOrUnderutilized
      after: 1m
      budgets:
        nodes: "50%"

  backend:
    enabled: true  # Backend 팀 NodePool 활성화

    capacityTypes:
      - on-demand

    instanceTypes:
      - t3.small
      - c7i-flex.large
      - m7i-flex.large

    limits:
      cpu: "8"
      memory: "16Gi"

    weight: 30

    disruption:
      policy: WhenEmptyOrUnderutilized
      after: 1m
      budgets:
        nodes: "50%"