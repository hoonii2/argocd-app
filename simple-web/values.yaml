replicaCount: 2

image:
  repository: hashicorp/http-echo
  tag: "0.2.3"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 5678

ingress:
  enabled: true
  ingressClassName: alb
  hostname: web.hoonii2.store
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    external-dns.alpha.kubernetes.io/hostname: web.hoonii2.store
    external-dns.alpha.kubernetes.io/aws-weight: "100"  # 가중치 추가
    external-dns.alpha.kubernetes.io/set-identifier: simple-web-primary  # 식별자 추가

clusterName: my-cluster