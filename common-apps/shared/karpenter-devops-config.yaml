apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-devops-config
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/hoonii2/argocd-app.git
    targetRevision: main
    path: charts/karpenter-config
    helm:
      valueFiles:
        - ../../common-apps/shared/values/karpenter-devops-config.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
