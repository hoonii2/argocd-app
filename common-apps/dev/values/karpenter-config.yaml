# my-cluster Dev 환경 설정
clusterName: my-cluster
environment: dev

# Instance Profile (Terraform output)
instanceProfileName: "eks_nodes-node-group-20251112072310118500000008-20251112073427281900000016"

ec2NodeClass:
  amiFamily: al2023
  
  blockDevice:
    volumeSize: 20Gi
    volumeType: gp3
    encrypted: true
  
  metadata:
    httpTokens: required
    httpPutResponseHopLimit: 2

tags:
  managed-by: argocd
  team: devops
  environment: dev

# ========================================
# Team NodePools (Dev 환경에서 활성화)
# ========================================
teams:
  web:
    enabled: true  # Web 팀 NodePool 활성화

    # Spot + On-Demand 혼합 (비용 최적화)
    capacityTypes:
      - spot         # 우선 (50% 저렴)
      - on-demand    # 폴백

    # ARM64 NodePool (우선)
    arm64:
      instanceTypes:
        - t4g.micro    # $0.0084/h (ARM) - 가장 저렴
        - t4g.small    # $0.0168/h (ARM)

    # AMD64 NodePool (폴백)
    amd64:
      instanceTypes:
        - t3.micro     # $0.0104/h
        - t3.small     # $0.0208/h

    limits:
      cpu: "2"       # Dev: 제한된 리소스
      memory: "4Gi"

    disruption:
      consolidationPolicy: WhenEmptyOrUnderutilized
      consolidateAfter: 30s  # 더 저렴한 인스턴스로 빠르게 교체
      budgets:
        - nodes: "100%"

  android:
    enabled: true  # Android 팀 NodePool 활성화

    capacityTypes:
      - spot
      - on-demand

    # ARM64 NodePool (우선)
    arm64:
      instanceTypes:
        - t4g.micro    # $0.0084/h (ARM) - 최저가
        - t4g.small    # $0.0168/h (ARM)

    # AMD64 NodePool (폴백)
    amd64:
      instanceTypes:
        - t3.micro     # $0.0104/h
        - t3.small     # $0.0208/h

    limits:
      cpu: "2"       # Dev: 제한된 리소스
      memory: "4Gi"

    disruption:
      consolidationPolicy: WhenEmptyOrUnderutilized
      consolidateAfter: 30s
      budgets:
        - nodes: "100%"

  backend:
    enabled: true  # Backend 팀 NodePool 활성화

    capacityTypes:
      - spot
      - on-demand

    # ARM64 NodePool (우선 - 비용 절감)
    arm64:
      instanceTypes:
        - t4g.micro    # $0.0084/h (ARM)
        - t4g.small    # $0.0168/h (ARM)

    # AMD64 NodePool (폴백)
    amd64:
      instanceTypes:
        - t3.micro     # $0.0104/h
        - t3.small     # $0.0208/h

    limits:
      cpu: "4"       # Dev: 제한된 리소스
      memory: "8Gi"

    disruption:
      consolidationPolicy: WhenEmptyOrUnderutilized
      consolidateAfter: 30s
      budgets:
        - nodes: "100%"