apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://charts.jenkins.io
    chart: jenkins
    targetRevision: 5.8.110
    helm:
      values: |
        controller:
          serviceType: ClusterIP

          # Use default plugins from chart (recommended by official docs)
          # Includes: kubernetes, workflow-aggregator, git, configuration-as-code
          # with compatible versions that resolve dependencies automatically
          # Note: docker-workflow and amazon-ecr will be installed via Jenkins UI after startup

          JCasC:
            defaultConfig: true
            configScripts:
              welcome-message: |
                jenkins:
                  systemMessage: "Jenkins for EKS MSA CI/CD"

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

          tolerations:
            - key: "team"
              operator: "Equal"
              value: "devops"
              effect: "NoSchedule"
            - key: "architecture"
              operator: "Equal"
              value: "arm64"
              effect: "NoSchedule"

          nodeSelector:
            kubernetes.io/arch: arm64
            team: devops

        agent:
          enabled: true
          tolerations:
            - key: "team"
              operator: "Equal"
              value: "devops"
              effect: "NoSchedule"
            - key: "architecture"
              operator: "Equal"
              value: "arm64"
              effect: "NoSchedule"
          nodeSelector:
            kubernetes.io/arch: arm64
            team: devops

        persistence:
          enabled: true
          size: 10Gi
          storageClass: gp2

  destination:
    server: https://kubernetes.default.svc
    namespace: devops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
