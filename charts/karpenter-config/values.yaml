# 클러스터 정보
clusterName: my-cluster

# Instance Profile 이름
instanceProfileName: "REPLACE_WITH_INSTANCE_PROFILE_NAME"

# NodePool 설정
nodePool:
  # On-Demand NodePool
  ondemand:
    enabled: true  # 기본값: 활성화
    
    # 프리티어 인스턴스 타입
    instanceTypes:
      - t3.micro
      - t3.small
    
    limits:
      cpu: "10"
      memory: "20Gi"
    
    weight: 50  # 중간 우선순위
    
    disruption:
      policy: WhenEmptyOrUnderutilized
      after: 1m
      budgets:
        nodes: "50%"
  
  # Spot NodePool
  spot:
    enabled: false  # 기본값: 비활성화 (필요 시 오버라이드)
    
    # 프리티어 인스턴스 타입 (다양성 확보)
    instanceTypes:
      - t3.micro
      - t3.small
      - c7i-flex.large
    
    limits:
      cpu: "20"      # Spot은 더 많이 허용
      memory: "40Gi"
    
    weight: 10  # 낮은 우선순위 (먼저 선택됨)
    
    disruption:
      policy: WhenEmptyOrUnderutilized
      after: 30s  # 빠르게 정리
      budgets:
        nodes: "100%"

# EC2NodeClass 설정
ec2NodeClass:
  name: default
  amiFamily: al2023
  
  blockDevice:
    volumeSize: 20Gi
    volumeType: gp3
    encrypted: true
  
  metadata:
    httpTokens: required
    httpPutResponseHopLimit: 2

# 태그
tags:
  managed-by: argocd
  team: devops
  environment: dev