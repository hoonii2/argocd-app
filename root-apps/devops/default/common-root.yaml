apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: common-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hoonii2/argocd-app.git
    targetRevision: main
    path: common-apps/default
    directory:
      recurse: false
      include: '*.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true