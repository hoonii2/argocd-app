apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 26.0.0
    helm:
      values: |
        # Prometheus server (standalone, no Mimir)
        server:
          enabled: true

          persistentVolume:
            enabled: true
            size: 10Gi
            storageClass: gp2

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          retention: "3d"

          tolerations:
            - key: team
              operator: Equal
              value: devops
              effect: NoSchedule
            - key: architecture
              operator: Equal
              value: arm64
              effect: NoSchedule

          nodeSelector:
            kubernetes.io/arch: arm64
            team: devops

        # Alertmanager - disabled (use Grafana alerting)
        alertmanager:
          enabled: false

        # Kube-state-metrics
        kube-state-metrics:
          enabled: true
          tolerations:
            - key: team
              operator: Equal
              value: devops
              effect: NoSchedule
            - key: architecture
              operator: Equal
              value: arm64
              effect: NoSchedule
          nodeSelector:
            kubernetes.io/arch: arm64
            team: devops

        # Prometheus-node-exporter
        prometheus-node-exporter:
          enabled: true
          tolerations:
            - operator: Exists

        # Prometheus-pushgateway - disabled
        prometheus-pushgateway:
          enabled: false

        # ConfigMap reload
        configmapReload:
          prometheus:
            enabled: true

        # Use default scrape configs from chart
        extraScrapeConfigs: |
          - job_name: 'kubernetes-pods-custom'
            kubernetes_sd_configs:
              - role: pod
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                action: keep
                regex: true
              - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                action: replace
                target_label: __metrics_path__
                regex: (.+)
              - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                action: replace
                regex: ([^:]+)(?::\d+)?;(\d+)
                replacement: $1:$2
                target_label: __address__
              - action: labelmap
                regex: __meta_kubernetes_pod_label_(.+)
              - source_labels: [__meta_kubernetes_namespace]
                action: replace
                target_label: namespace
              - source_labels: [__meta_kubernetes_pod_name]
                action: replace
                target_label: pod

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
