apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.108.0
    helm:
      values: |
        mode: deployment

        replicaCount: 1

        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

        config:
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318

          processors:
            batch:
              timeout: 10s
              send_batch_size: 1024

            memory_limiter:
              check_interval: 1s
              limit_mib: 400
              spike_limit_mib: 100

            resource:
              attributes:
                - key: cluster
                  value: my-cluster
                  action: upsert

          exporters:
            # Traces to Tempo
            otlp/tempo:
              endpoint: tempo.observability.svc.cluster.local:4317
              tls:
                insecure: true

            # Logs to Loki
            loki:
              endpoint: http://loki.observability.svc.cluster.local:3100/loki/api/v1/push

            debug:
              verbosity: basic

          service:
            pipelines:
              traces:
                receivers: [otlp]
                processors: [memory_limiter, resource, batch]
                exporters: [otlp/tempo]

              logs:
                receivers: [otlp]
                processors: [memory_limiter, resource, batch]
                exporters: [loki]

        ports:
          otlp:
            enabled: true
            containerPort: 4317
            servicePort: 4317
            protocol: TCP
          otlp-http:
            enabled: true
            containerPort: 4318
            servicePort: 4318
            protocol: TCP

        tolerations:
          - key: team
            operator: Equal
            value: devops
            effect: NoSchedule
          - key: architecture
            operator: Equal
            value: arm64
            effect: NoSchedule

        nodeSelector:
          kubernetes.io/arch: arm64
          team: devops

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
